# SPDX-FileCopyrightText: 2025 The Linux Foundation

# Runs on a new pull request, performs build and runs tests
name: 'Python Build/Test'

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - main
      - master
    paths:
      - '**'
      - '!.github/**'
      - '!.*'
      - '!tox.ini'

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions: {}

jobs:
  build-test:
    permissions:
      contents: read  # Check out the repository to build and test.
      pull-requests: read  # Read PR metadata for status reporting.
    # yamllint disable-line rule:line-length
    uses: lfreleng-actions/python-workflows/.github/workflows/build-test.yaml@2b326364c9dfffe1b6c8fddab5b517d8c92e5f5c  # v0.5.0
    with:
      # Preserve the repository's audit policy: allow dependency-audit
      # failures to be non-blocking when the variable opts in.
      audit_permit_fail: ${{ vars.NO_BLOCK_AUDIT_FAIL == 'true' }}
